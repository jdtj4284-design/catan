<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="参加人数に合わせて卓を組み、座席とスタートプレイヤーを決めるカタン用ツール">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b222c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カタン席決め">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>html,body{background:#0b222c}</style>
</head>
<body>
<title>カタン席決め</title>
<style>
  :root{
    --sea-deep:#0b222c;
    --sea:#123441;
    --sea-soft:#18404e;
    --line:#2a5c6d;
    --sand:#f3e6cd;
    --sand-dim:#a9bfc7;
    --clay:#e2673d;
    --pasture:#8ac545;
    --gold:#f5c33f;
    --danger:#ef6a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:var(--sea-deep);
    color:var(--sand);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
    line-height:1.4;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  #setup,#game{display:flex;flex-direction:column;gap:16px}

  /* ---- header ---- */
  .head{display:flex;align-items:center;gap:10px;padding-top:4px}
  .head .mark{
    width:38px;height:42px;flex:none;
    background:var(--gold);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    display:grid;place-items:center;
    color:#3d2a00;font-size:20px;
  }
  .head h1{
    margin:0;font-size:23px;font-weight:800;letter-spacing:.04em;
  }
  .head p{margin:2px 0 0;font-size:12px;letter-spacing:.14em;color:var(--sand-dim)}

  /* ---- cards ---- */
  .card{
    background:var(--sea);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
  }
  .card h2{
    margin:0 0 10px;font-size:15px;font-weight:800;letter-spacing:.08em;
    color:var(--sand-dim);
    display:flex;align-items:center;gap:8px;
  }
  .step{
    display:grid;place-items:center;
    width:23px;height:23px;flex:none;
    border-radius:7px;background:var(--gold);color:#3b2900;
    font-size:13px;font-weight:800;letter-spacing:0;
  }

  /* ---- 人数ステッパー ---- */
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{
    width:66px;height:60px;flex:none;
    border-radius:12px;border:1.5px solid var(--line);
    background:var(--sea-deep);color:var(--sand);
    font-size:26px;font-family:inherit;line-height:1;cursor:pointer;
  }
  .stepper button:disabled{opacity:.3}
  .stepper .val{
    flex:1;text-align:center;
    font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;
  }
  .stepper .unit{font-size:16px;color:var(--sand-dim);margin-left:3px;font-weight:700}

  /* ---- name rows ---- */
  .rows{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:8px}
  .row .idx{
    width:26px;flex:none;text-align:center;
    font-size:14px;font-weight:700;color:var(--sand-dim);
    font-variant-numeric:tabular-nums;
  }
  .row input{
    flex:1;min-width:0;
    background:var(--sea-deep);
    border:1.5px solid var(--line);
    border-radius:10px;
    color:var(--sand);
    font-size:18px;
    font-family:inherit;
    padding:12px 10px;
  }
  .row input::placeholder{color:#5e7d89}
  .row input:focus{outline:none;border-color:var(--gold)}
  .row input.bad{border-color:var(--danger)}
  .sep{
    width:52px;height:48px;flex:none;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:transparent;
    color:#5e7d89;
    font-size:20px;
    line-height:1;
    display:grid;place-items:center;
    cursor:pointer;
  }
  .sep.on{
    background:rgba(245,195,63,.16);
    border-color:var(--gold);
    color:var(--gold);
  }
  .note{margin:10px 0 0;font-size:13px;color:var(--sand-dim)}
  .note b{color:var(--gold)}
  .note.tight{margin:0 0 10px}

  /* ---- 卓構成 ---- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip-b{
    flex:1 1 44%;min-width:132px;
    padding:10px 8px;border-radius:11px;
    border:1.5px solid var(--line);background:var(--sea-deep);
    color:var(--sand);font-family:inherit;cursor:pointer;text-align:center;
  }
  .chip-b .sz{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .chip-b .ty{font-size:11px;color:var(--sand-dim);margin-top:3px}
  .chip-b.on{border-color:var(--gold);background:rgba(245,195,63,.14)}
  .chip-b.on .ty{color:var(--gold)}
  .chip-b .rec{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;
    background:var(--gold);color:#3b2900;border-radius:5px;padding:1px 5px;margin-left:5px;
  }

  .tconf{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .trow{display:flex;align-items:center;gap:7px}
  .trow .tname{width:42px;flex:none;font-weight:800;font-size:16px;color:var(--tc)}
  .ttype{
    flex:1;min-width:0;height:46px;
    border-radius:10px;border:1.5px solid var(--line);
    background:var(--sea-deep);color:var(--sand-dim);
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  }
  .ttype.ext{border-color:var(--pasture);color:var(--pasture)}
  .tnum{display:flex;align-items:center;gap:4px;flex:none}
  .tnum button{
    width:42px;height:46px;
    border-radius:10px;border:1.5px solid var(--line);
    background:var(--sea-deep);color:var(--sand);
    font-size:21px;font-family:inherit;line-height:1;cursor:pointer;
  }
  .tnum .v{width:32px;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .tnum .v.bad{color:var(--danger)}

  /* ---- 参加者の卓割り当て ---- */
  .asum{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .asum span{
    font-size:13px;font-weight:800;padding:7px 10px;border-radius:9px;
    border:1.5px solid var(--tc);color:var(--tc);background:var(--sea-deep);
    font-variant-numeric:tabular-nums;
  }
  .asum span.ng{border-color:var(--danger);color:var(--danger)}
  .arows{display:flex;flex-direction:column;gap:8px}
  .arow{display:flex;align-items:center;gap:8px}
  .anm{
    flex:1;min-width:0;font-size:16px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .anm .sw{color:var(--gold);margin-left:4px;font-size:13px}
  .apick{display:flex;gap:5px;flex:none}
  .apk{
    min-width:44px;height:46px;padding:0 6px;
    border-radius:10px;border:1.5px solid var(--line);
    background:var(--sea-deep);color:var(--sand-dim);
    font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
  }
  .apk.on{background:var(--tc);border-color:var(--tc);color:#111}

  .total{
    margin-top:12px;padding:10px;border-radius:10px;
    background:var(--sea-deep);border:1px solid var(--line);
    font-size:14px;font-weight:700;text-align:center;
  }
  .total.ok{color:var(--pasture);border-color:rgba(138,197,69,.5)}
  .total.ng{color:var(--danger);border-color:rgba(239,106,90,.5)}

  /* ---- buttons ---- */
  .btn{
    width:100%;
    display:block;
    border:none;
    border-radius:14px;
    padding:18px 12px;
    font-family:inherit;
    font-size:21px;
    font-weight:800;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn-main{background:var(--gold);color:#3b2900;box-shadow:0 4px 0 #b98d13}
  .btn-main:active{box-shadow:0 2px 0 #b98d13}
  .btn-next{background:var(--pasture);color:#12300a;box-shadow:0 4px 0 #58862c}
  .btn-next:active{box-shadow:0 2px 0 #58862c}
  .btn-sub{
    background:transparent;border:1.5px solid var(--line);color:var(--sand);
    font-size:16px;padding:14px 10px;
  }
  .btn-off{opacity:.4}
  .btns{display:flex;flex-direction:column;gap:10px}
  .btns.two{flex-direction:row}
  .btns.two .btn{flex:1}

  /* ---- round tabs ---- */
  .tabs{display:flex;gap:8px}
  .tab{
    flex:1;padding:12px 6px;border-radius:11px;
    border:1.5px solid var(--line);background:transparent;
    color:var(--sand-dim);font-family:inherit;font-size:16px;font-weight:700;
    cursor:pointer;
  }
  .tab.on{background:var(--sand);color:var(--sea-deep);border-color:var(--sand)}

  .legend{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:13px;color:var(--sand-dim);
    background:var(--sea);border:1px solid var(--line);
    border-radius:11px;padding:10px 8px;text-align:center;
  }
  .legend .k{color:var(--gold);font-weight:700}

  /* ---- table block ---- */
  .table{
    border-radius:16px;
    padding:12px 12px 14px;
    border:2px solid var(--tc);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--tc-soft), rgba(0,0,0,0) 70%),
      var(--sea);
  }
  .t-0{--tc:#e2673d;--tc-soft:rgba(226,103,61,.22);--tc-ring:rgba(226,103,61,.5)}
  .t-1{--tc:#8ac545;--tc-soft:rgba(138,197,69,.20);--tc-ring:rgba(138,197,69,.5)}
  .t-2{--tc:#f0b429;--tc-soft:rgba(240,180,41,.20);--tc-ring:rgba(240,180,41,.5)}
  .t-3{--tc:#4aa3df;--tc-soft:rgba(74,163,223,.20);--tc-ring:rgba(74,163,223,.5)}
  .t-4{--tc:#b07de0;--tc-soft:rgba(176,125,224,.20);--tc-ring:rgba(176,125,224,.5)}
  .t-5{--tc:#35b39b;--tc-soft:rgba(53,179,155,.20);--tc-ring:rgba(53,179,155,.5)}
  .thead{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
  .thead .chip{
    background:var(--tc);color:#111;
    font-size:19px;font-weight:800;letter-spacing:.05em;
    padding:5px 13px;border-radius:9px;
  }
  .thead .sub{font-size:12px;color:var(--sand-dim);letter-spacing:.06em}

  .diagram{
    position:relative;
    display:grid;
    grid-template-columns:1fr 78px 1fr;
    gap:9px;
    align-items:center;
    justify-items:center;
    padding:4px 0;
  }
  .ring{
    position:absolute;left:6%;right:6%;top:12%;bottom:12%;
    border:2px dashed var(--tc-ring);
    border-radius:50%;
    pointer-events:none;
  }
  .hex{
    width:78px;height:86px;
    background:var(--tc);
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    display:grid;place-items:center;align-content:center;
    color:#101010;
    z-index:1;
  }
  .hex .cw{font-size:26px;line-height:1;font-weight:700}
  .hex .cwt{font-size:10px;letter-spacing:.06em;margin-top:2px}

  .seat{
    position:relative;z-index:1;
    width:100%;
    background:var(--sea-soft);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:9px 7px;
    text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .seat.wide{width:min(64%,210px)}
  .seat .num{
    font-size:19px;line-height:1;font-weight:700;color:var(--tc);
  }
  .seat .nm{
    font-size:clamp(14px,4.1vw,18px);font-weight:700;
    word-break:break-word;line-height:1.25;
  }
  .seat.lead{
    background:#324841;
    border-color:var(--gold);
  }
  .seat.lead .num{color:var(--gold)}
  .seat .star{
    font-size:11px;font-weight:800;letter-spacing:.08em;
    color:#3b2900;background:var(--gold);
    border-radius:6px;padding:2px 7px;
  }

  .info{
    font-size:13px;color:var(--sand-dim);
    background:var(--sea);border:1px solid var(--line);
    border-radius:11px;padding:11px 12px;
  }
  .info b{color:var(--sand)}
  .foot{font-size:11px;color:#5e7d89;text-align:center;letter-spacing:.05em}

  /* ---- 自前ダイアログ / メッセージ（iOSのalert・confirmは使わない） ---- */
  .msg{
    margin:12px 0 0;padding:11px 12px;border-radius:10px;
    background:rgba(239,106,90,.14);border:1px solid var(--danger);
    color:#ffd9d3;font-size:14px;font-weight:700;line-height:1.6;
  }
  .msg div + div{margin-top:6px}
  .sheet{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;
    background:rgba(4,15,20,.78);
    display:flex;align-items:center;justify-content:center;
    padding:22px;
  }
  .sheetbox{
    width:100%;max-width:340px;
    background:var(--sea);border:1px solid var(--line);
    border-radius:16px;padding:18px 16px;
  }
  .sheetbox p{margin:0 0 14px;font-size:17px;line-height:1.55;text-align:center}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:no-preference){
    .table{animation:pop .22s ease-out both}
    @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>

<div class="wrap">
  <div class="head">
    <div class="mark">🎲</div>
    <div>
      <h1>カタン席決め</h1>
      <p id="headSub">8人 / 2卓 / 2回戦</p>
    </div>
  </div>

  <!-- ============ SETUP ============ -->
  <section id="setup">
    <div class="card">
      <h2><span class="step">1</span>参加人数</h2>
      <div class="stepper">
        <button type="button" id="nMinus" aria-label="人数を減らす">−</button>
        <div class="val"><span id="nVal">8</span><span class="unit">人</span></div>
        <button type="button" id="nPlus" aria-label="人数を増やす">＋</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="step">2</span>参加者の名前</h2>
      <div class="rows" id="rows"></div>
      <p class="note" id="sepNote">⚔️ をつけた<b>2人は必ず別の卓</b>になります（2人まで）。</p>
    </div>

    <div class="card">
      <h2><span class="step">3</span>卓の組み合わせ</h2>
      <p class="note tight">おすすめから選ぶか、下で1卓ずつ調整できます。</p>
      <div class="chips" id="chips"></div>
      <button class="btn btn-sub" id="manualToggle" type="button" style="margin-top:12px">▼ 1卓ずつ調整する</button>
      <div id="manual" hidden>
        <div class="tconf" id="tconf"></div>
        <div class="btns two" style="margin-top:10px">
          <button class="btn btn-sub" id="tMinus" type="button">− 卓を減らす</button>
          <button class="btn btn-sub" id="tPlus" type="button">＋ 卓を追加</button>
        </div>
      </div>
      <div class="total" id="total"></div>
    </div>

    <div class="card">
      <h2><span class="step">4</span>メンバーの振り分け</h2>
      <p class="note tight">だれをどの卓に入れるか、ボタンで指定してください。</p>
      <div class="asum" id="asum"></div>
      <div class="arows" id="arows"></div>
      <button class="btn btn-sub" id="autoBtn" type="button" style="margin-top:12px">🎲 おまかせで振り分け</button>
      <div class="msg" id="setupMsg" hidden></div>
    </div>

    <div class="btns">
      <button class="btn btn-main" id="goBtn" type="button">🎲 席決め！</button>
      <button class="btn btn-sub" id="backToResult" type="button" hidden>▶ 結果にもどる</button>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="game" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="legend">
      <span><span class="k">①</span> がスタート</span>
      <span>／</span>
      <span>①→②→③… <span class="k">時計まわり</span></span>
    </div>
    <div id="tables" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="info" id="info"></div>
    <div class="btns">
      <button class="btn btn-next" id="round2Btn" type="button" hidden>🔀 2回戦の席決め！</button>
      <button class="btn btn-sub" id="rerollBtn" type="button">🎲 このラウンドをふり直す</button>
      <div class="btns two">
        <button class="btn btn-sub" id="editBtn" type="button">✏️ 設定をなおす</button>
        <button class="btn btn-sub" id="resetBtn" type="button">🔄 最初から</button>
      </div>
    </div>
  </section>

  <div class="foot">SETTLE THE SEATS · 木を1つください</div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetbox">
    <p id="sheetMsg"></p>
    <div class="btns two" id="sheetOk">
      <button class="btn btn-sub" id="sheetNo" type="button">キャンセル</button>
      <button class="btn btn-main" id="sheetYes" type="button" style="font-size:17px;padding:14px 10px">OK</button>
    </div>
    <div class="btns" id="sheetAlt" hidden>
      <button class="btn btn-next" id="sheetA" type="button" style="font-size:17px;padding:15px 10px"></button>
      <button class="btn btn-main" id="sheetB" type="button" style="font-size:17px;padding:15px 10px"></button>
      <button class="btn btn-sub" id="sheetC" type="button">キャンセル</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- iPhone: ホーム画面に追加でアプリ風に ---------- */
  try{
    var metas = [
      ["viewport","width=device-width, initial-scale=1, viewport-fit=cover"],
      ["apple-mobile-web-app-capable","yes"],
      ["mobile-web-app-capable","yes"],
      ["apple-mobile-web-app-status-bar-style","black-translucent"],
      ["apple-mobile-web-app-title","カタン席決め"],
      ["theme-color","#0b222c"]
    ];
    metas.forEach(function(m){
      if(document.querySelector('meta[name="'+m[0]+'"]')) return;
      var el=document.createElement("meta");
      el.setAttribute("name",m[0]); el.setAttribute("content",m[1]);
      document.head.appendChild(el);
    });
  }catch(e){}

  /* ---------- 定数 ---------- */
  var KEY="catan-seat-v2";
  var MIN_N=3, MAX_N=30;          // 参加人数の下限・上限
  var STD_MIN=3, STD_MAX=4;       // スタンダード版：1卓3〜4人
  var EXT_MIN=5, EXT_MAX=6;       // 5〜6人用拡張版：1卓5〜6人
  var SEAT_MIN=STD_MIN, SEAT_MAX=EXT_MAX;
  var TNAMES="ABCDEFGHIJ";

  function factory(){
    return {
      n:8,
      names:["ヒデキチ","たかなり","","","","","",""],
      sep:[0,1],
      sizes:[4,4],
      types:["std","std"],
      assign:[0,1,0,1,0,1,0,1],   // 参加者ごとの所属卓（⚔️の2人が別卓になる安全な初期値）
      manual:false,
      rounds:[],
      view:0
    };
  }
  var state=factory();

  /* ---------- 保存・復元 ---------- */
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  // 保存データを読めたら true
  function load(){
    try{
      var raw=localStorage.getItem(KEY); if(!raw) return false;
      var s=JSON.parse(raw);
      if(!s) return false;
      if(typeof s.n!=="number" || s.n<MIN_N || s.n>MAX_N) return false;
      if(!Array.isArray(s.names) || s.names.length!==s.n) return false;
      if(!Array.isArray(s.sizes) || !s.sizes.length) return false;
      if(!Array.isArray(s.types) || s.types.length!==s.sizes.length) return false;
      if(!Array.isArray(s.sep)) return false;
      if(!Array.isArray(s.rounds)) return false;
      for(var i=0;i<s.rounds.length;i++){
        var t=s.rounds[i] && s.rounds[i].tables;
        if(!Array.isArray(t)) return false;
        var c=0;
        for(var k=0;k<t.length;k++){ if(!Array.isArray(t[k])) return false; c+=t[k].length; }
        if(c!==s.n) return false;
      }
      state.n=s.n;
      state.names=s.names.map(function(v){return typeof v==="string"?v:"";});
      state.sep=s.sep.filter(function(v){return typeof v==="number"&&v>=0&&v<s.n;}).slice(0,2);
      state.sizes=s.sizes.map(function(v){return Math.max(1,Math.min(8,v|0));});
      state.types=s.types.map(function(v){return v==="ext"?"ext":"std";});
      state.manual=!!s.manual;
      state.rounds=s.rounds;
      state.view=Math.min(s.view||0, Math.max(0,state.rounds.length-1));

      // 所属卓（古い保存データには入っていないので、その場合は組み直す）
      var ok=Array.isArray(s.assign) && s.assign.length===s.n;
      if(ok){
        for(var a=0;a<s.assign.length;a++){
          var v=s.assign[a];
          if(typeof v!=="number" || v<0 || v>=state.sizes.length){ ok=false; break; }
        }
      }
      if(ok) state.assign=s.assign.slice();
      else autoAssign(state.rounds.length);
      return true;
    }catch(e){}
    return false;
  }

  /* ---------- 卓構成の計算 ---------- */
  function typeOfSize(sz){ return sz>=EXT_MIN ? "ext" : "std"; }
  function sum(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }

  // T卓に均等に割る（大きい卓から1人ずつ多く）
  function balanced(n,T){
    var base=Math.floor(n/T), rem=n%T, out=[];
    for(var i=0;i<T;i++) out.push(base + (i<rem ? 1 : 0));
    return out;
  }
  // 参加人数nで成立する卓構成の候補（卓数の少ない順）
  function candidates(n){
    var out=[];
    var tmin=Math.ceil(n/SEAT_MAX), tmax=Math.floor(n/SEAT_MIN);
    for(var T=tmin; T<=tmax; T++){
      var sz=balanced(n,T), ok=true;
      for(var i=0;i<sz.length;i++){ if(sz[i]<SEAT_MIN||sz[i]>SEAT_MAX) ok=false; }
      if(ok) out.push(sz);
    }
    return out;
  }
  function recommend(n){
    var c=candidates(n);
    return c.length ? c[0].slice() : balanced(n, Math.max(1,Math.ceil(n/SEAT_MAX)));
  }
  function applySizes(sizes){
    state.sizes=sizes.slice();
    state.types=sizes.map(typeOfSize);
    autoAssign(state.rounds.length);   // 卓構成が変わったら振り分けを組み直す（あとから手で変更できる）
  }
  // 構成の説明（例：拡張2卓 / 標準3卓 / 拡張1・標準1）
  function describe(sizes,types){
    var std=0,ext=0;
    for(var i=0;i<sizes.length;i++){ if((types?types[i]:typeOfSize(sizes[i]))==="ext") ext++; else std++; }
    var p=[];
    if(ext) p.push("拡張"+ext+"卓");
    if(std) p.push("標準"+std+"卓");
    return p.join("・");
  }

  /* ---------- 席決めロジック ---------- */
  function pk(a,b){ return a<b ? a+"-"+b : b+"-"+a; }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
    return a;
  }
  // これまでのラウンドで同卓した回数
  function prevCounts(upto){
    var m={};
    for(var r=0;r<upto && r<state.rounds.length;r++){
      var tb=state.rounds[r].tables;
      for(var t=0;t<tb.length;t++){
        var g=tb[t];
        for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++){
          var k=pk(g[i],g[j]); m[k]=(m[k]||0)+1;
        }
      }
    }
    return m;
  }
  // 再対戦の多さを採点（少ないほど良い）
  function score(gs,prev){
    var per={}, total=0;
    for(var k=0;k<gs.length;k++){
      var g=gs[k];
      for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++){
        var c=prev[pk(g[i],g[j])]||0;
        if(c){
          total+=c;
          per[g[i]]=(per[g[i]]||0)+c;
          per[g[j]]=(per[g[j]]||0)+c;
        }
      }
    }
    var mx=0,sq=0;
    for(var key in per){ var v=per[key]; if(v>mx) mx=v; sq+=v*v; }
    return [total,mx,sq];
  }
  function cmp(a,b){ return (a[0]-b[0]) || (a[1]-b[1]) || (a[2]-b[2]); }
  function groupIndexOf(gs,p){
    for(var k=0;k<gs.length;k++){ if(gs[k].indexOf(p)>=0) return k; }
    return -1;
  }
  function sepBroken(gs,sep){
    return sep ? groupIndexOf(gs,sep[0])===groupIndexOf(gs,sep[1]) : false;
  }
  function randomGroups(n,sizes,sep){
    var idx=[],i;
    for(i=0;i<n;i++) idx.push(i);
    shuffle(idx);
    var gs=[],p=0;
    for(i=0;i<sizes.length;i++){ gs.push(idx.slice(p,p+sizes[i])); p+=sizes[i]; }
    if(sep && sepBroken(gs,sep)){
      var ga=groupIndexOf(gs,sep[0]);
      var other=(ga+1)%gs.length;
      var posA=gs[ga].indexOf(sep[1]);
      var posO=-1;
      for(i=0;i<gs[other].length;i++){
        if(gs[other][i]!==sep[0] && gs[other][i]!==sep[1]){ posO=i; break; }
      }
      if(posA>=0 && posO>=0){
        var tmp=gs[ga][posA]; gs[ga][posA]=gs[other][posO]; gs[other][posO]=tmp;
      }
    }
    return gs;
  }
  // 卓をまたぐ2人の入れ替えで、再対戦が減るなら採用（回数は必ず有限）
  function improve(gs,prev,sep){
    if(gs.length<2) return gs;
    var cur=score(gs,prev);
    for(var sweep=0; sweep<4; sweep++){
      var moved=false;
      for(var a=0;a<gs.length;a++){
        for(var b=a+1;b<gs.length;b++){
          for(var i=0;i<gs[a].length;i++){
            for(var j=0;j<gs[b].length;j++){
              var x=gs[a][i], y=gs[b][j];
              gs[a][i]=y; gs[b][j]=x;
              if(sep && sepBroken(gs,sep)){ gs[a][i]=x; gs[b][j]=y; continue; }
              var sc=score(gs,prev);
              if(cmp(sc,cur)<0){ cur=sc; moved=true; }
              else { gs[a][i]=x; gs[b][j]=y; }
            }
          }
        }
      }
      if(!moved) break;
    }
    return gs;
  }
  // 卓の人数どおりに自動で振り分ける（前のラウンドがあれば再対戦が少なくなるように）
  function autoAssign(upto){
    var sizes=state.sizes.slice(), i;
    if(sum(sizes)!==state.n){
      // 合計が合っていないときは頭から順に詰める（不一致の警告は別途出る）
      state.assign=[];
      var t=0,c=0;
      for(i=0;i<state.n;i++){
        state.assign.push(t);
        c++;
        if(c>=Math.max(1,sizes[t])){ c=0; if(t<sizes.length-1) t++; }
      }
      return;
    }
    var prev=prevCounts(typeof upto==="number" ? upto : state.rounds.length);
    var sep=(state.sep.length===2 && sizes.length>=2) ? state.sep.slice() : null;
    var best=null,bestScore=null;
    for(var r=0;r<40;r++){
      var gs=randomGroups(state.n,sizes,sep);
      gs=improve(gs,prev,sep);
      var sc=score(gs,prev);
      if(bestScore===null || cmp(sc,bestScore)<0){ bestScore=sc; best=gs; }
      if(bestScore[0]===0) break;
    }
    if(!best) return;
    state.assign=new Array(state.n);
    for(i=0;i<best.length;i++){
      for(var k=0;k<best[i].length;k++) state.assign[best[i][k]]=i;
    }
  }

  // 手動で決めた所属卓からグループを作る（人数が合わなければ null）
  function groupsFromAssign(){
    var gs=[],i;
    for(i=0;i<state.sizes.length;i++) gs.push([]);
    for(i=0;i<state.n;i++){
      var t=state.assign[i];
      if(typeof t!=="number" || t<0 || t>=gs.length) return null;
      gs[t].push(i);
    }
    for(i=0;i<gs.length;i++){ if(gs[i].length!==state.sizes[i]) return null; }
    return gs;
  }

  // remix=true のときだけ卓を組み替える。通常は所属卓を保ったまま席順だけ抽選する。
  function makeRound(roundIndex, remix){
    var sizes=state.sizes.slice(), i, k;
    if(sum(sizes)!==state.n) return null;
    for(i=0;i<sizes.length;i++){ if(sizes[i]<1) return null; }

    var prev=prevCounts(roundIndex);
    var gs;

    if(remix){
      // ⚔️は2卓以上のときだけ効く（1卓しかなければ物理的に分けられない）
      var sep=(state.sep.length===2 && sizes.length>=2) ? state.sep.slice() : null;
      var best=null,bestScore=null;
      for(var r=0;r<40;r++){
        var cand=randomGroups(state.n,sizes,sep);
        cand=improve(cand,prev,sep);
        var sc=score(cand,prev);
        if(bestScore===null || cmp(sc,bestScore)<0){ bestScore=sc; best=cand; }
        if(bestScore[0]===0) break;
      }
      if(!best) return null;
      gs=best;
      // 組み替えた結果を所属卓に反映（以後のふり直しではこの卓を維持する）
      state.assign=new Array(state.n);
      for(i=0;i<gs.length;i++){ for(k=0;k<gs[i].length;k++) state.assign[gs[i][k]]=i; }
    }else{
      gs=groupsFromAssign();
      if(!gs) return null;
    }

    var sc2=score(gs,prev);
    var tables=gs.map(function(g){ return shuffle(g.slice()); });   // 席順だけを卓の中で抽選
    return { tables:tables, remix:!!remix, repeat:{ total:sc2[0], max:sc2[1] } };
  }

  /* ---------- 画面 ---------- */
  var $=function(id){ return document.getElementById(id); };

  function nameOf(i){
    var n=(state.names[i]||"").trim();
    return n || ("プレイヤー"+(i+1));
  }
  function headSub(){
    $("headSub").textContent = state.n+"人 / "+state.sizes.length+"卓 / 2回戦";
  }

  /* ----- 1. 人数 ----- */
  function renderCount(){
    $("nVal").textContent=state.n;
    $("nMinus").disabled = state.n<=MIN_N;
    $("nPlus").disabled  = state.n>=MAX_N;
  }
  function setCount(n){
    n=Math.max(MIN_N,Math.min(MAX_N,n));
    if(n===state.n) return;
    state.n=n;
    while(state.names.length<n) state.names.push("");
    state.names.length=n;
    state.sep=state.sep.filter(function(v){ return v<n; });
    applySizes(recommend(n));   // 人数を変えたら卓構成はおすすめに戻す
    state.manual=false;
    save(); renderSetup();
  }

  /* ----- 2. 名前 ----- */
  function renderNames(){
    var rows=$("rows");
    rows.innerHTML="";
    for(var i=0;i<state.n;i++){
      (function(i){
        var row=document.createElement("div"); row.className="row";
        var idx=document.createElement("div"); idx.className="idx"; idx.textContent=(i+1);

        var inp=document.createElement("input");
        inp.type="text"; inp.value=state.names[i]||"";
        inp.placeholder="プレイヤー"+(i+1);
        inp.autocomplete="off"; inp.spellcheck=false;
        inp.setAttribute("enterkeyhint","next");
        inp.addEventListener("input",function(){
          state.names[i]=inp.value;
          inp.classList.remove("bad");
          save(); refreshAssignNames(); validateLive();
        });

        var sep=document.createElement("button");
        sep.type="button"; sep.className="sep"+(state.sep.indexOf(i)>=0?" on":"");
        sep.textContent="⚔️";
        sep.setAttribute("aria-label","別卓にする");
        sep.addEventListener("click",function(){
          safely(function(){
            var at=state.sep.indexOf(i);
            if(at>=0){ state.sep.splice(at,1); }
            else{
              if(state.sep.length>=2){ showMsg(["⚔️ は2人までです。先にどちらかをタップして外してください。"]); return; }
              state.sep.push(i);
            }
            save(); renderSetup();
          });
        });

        row.appendChild(idx); row.appendChild(inp); row.appendChild(sep);
        rows.appendChild(row);
      })(i);
    }
    $("sepNote").innerHTML = state.sizes.length<2
      ? "⚔️ の指定は<b>1卓のときは使われません</b>（全員が同じ卓のため）。"
      : "⚔️ をつけた<b>2人は必ず別の卓</b>になります（2人まで）。";
  }

  /* ----- 3. 卓構成 ----- */
  function sameSizes(a,b){
    if(a.length!==b.length) return false;
    for(var i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; }
    return true;
  }
  function renderChips(){
    var box=$("chips");
    box.innerHTML="";
    var cands=candidates(state.n);
    if(!cands.length){
      var p=document.createElement("div");
      p.className="note";
      p.textContent="この人数でぴったり組める構成がありません。下の「1卓ずつ調整する」で決めてください。";
      box.appendChild(p);
      return;
    }
    cands.slice(0,4).forEach(function(sz,ci){
      var b=document.createElement("button");
      b.type="button";
      b.className="chip-b"+(sameSizes(sz,state.sizes)?" on":"");
      var s=document.createElement("div"); s.className="sz"; s.textContent=sz.join("＋");
      if(ci===0){
        var r=document.createElement("span"); r.className="rec"; r.textContent="おすすめ";
        s.appendChild(r);
      }
      var t=document.createElement("div"); t.className="ty"; t.textContent=describe(sz,null);
      b.appendChild(s); b.appendChild(t);
      b.addEventListener("click",function(){
        safely(function(){ applySizes(sz); state.manual=false; save(); renderSetup(); });
      });
      box.appendChild(b);
    });
  }
  function renderTconf(){
    var box=$("tconf");
    box.innerHTML="";
    for(var i=0;i<state.sizes.length;i++){
      (function(i){
        var row=document.createElement("div");
        row.className="trow t-"+(i%6);

        var nm=document.createElement("div"); nm.className="tname";
        nm.textContent=TNAMES.charAt(i)+"卓";

        var ty=document.createElement("button");
        ty.type="button";
        ty.className="ttype"+(state.types[i]==="ext"?" ext":"");
        ty.textContent=state.types[i]==="ext" ? "拡張（5〜6人）" : "スタンダード（3〜4人）";
        ty.addEventListener("click",function(){
          safely(function(){
            if(state.types[i]==="ext"){
              state.types[i]="std";
              state.sizes[i]=Math.max(STD_MIN,Math.min(STD_MAX,state.sizes[i]));
            }else{
              state.types[i]="ext";
              state.sizes[i]=Math.max(EXT_MIN,Math.min(EXT_MAX,state.sizes[i]));
            }
            state.manual=true; save(); renderSetup();
          });
        });

        var num=document.createElement("div"); num.className="tnum";
        var mi=document.createElement("button"); mi.type="button"; mi.textContent="−";
        var v=document.createElement("div"); v.className="v"; v.textContent=state.sizes[i];
        var pl=document.createElement("button"); pl.type="button"; pl.textContent="＋";
        var lim=state.types[i]==="ext" ? [EXT_MIN,EXT_MAX] : [STD_MIN,STD_MAX];
        if(state.sizes[i]<lim[0] || state.sizes[i]>lim[1]) v.className="v bad";
        mi.addEventListener("click",function(){
          safely(function(){
            if(state.sizes[i]<=1) return;
            state.sizes[i]--; state.manual=true; save(); renderSetup();
          });
        });
        pl.addEventListener("click",function(){
          safely(function(){
            if(state.sizes[i]>=8) return;
            state.sizes[i]++; state.manual=true; save(); renderSetup();
          });
        });
        num.appendChild(mi); num.appendChild(v); num.appendChild(pl);

        row.appendChild(nm); row.appendChild(ty); row.appendChild(num);
        box.appendChild(row);
      })(i);
    }
    $("tMinus").disabled = state.sizes.length<=1;
    $("tMinus").classList.toggle("btn-off", state.sizes.length<=1);
  }
  function setTableCount(T){
    T=Math.max(1,Math.min(10,T));
    if(T===state.sizes.length) return;
    applySizes(balanced(state.n,T));   // 卓数を変えたら人数を割り直す
    state.manual=true;
    save(); renderSetup();
  }

  /* ----- 4. メンバーの振り分け ----- */
  function assignCounts(){
    var c=[],i;
    for(i=0;i<state.sizes.length;i++) c.push(0);
    for(i=0;i<state.n;i++){
      var t=state.assign[i];
      if(typeof t==="number" && t>=0 && t<c.length) c[t]++;
    }
    return c;
  }
  // 名前を打っている最中は、割り当て欄の名前だけを軽く書き換える
  function refreshAssignNames(){
    var els=$("arows").querySelectorAll(".anm");
    for(var i=0;i<els.length && i<state.n;i++){
      if(els[i].firstChild) els[i].firstChild.nodeValue=nameOf(i);
    }
  }
  function renderAssign(){
    var counts=assignCounts(), i;

    var sm=$("asum"); sm.innerHTML="";
    for(i=0;i<state.sizes.length;i++){
      var sp=document.createElement("span");
      var okc = counts[i]===state.sizes[i];
      sp.className="t-"+(i%6)+(okc?"":" ng");
      sp.textContent=TNAMES.charAt(i)+"卓 "+counts[i]+"/"+state.sizes[i]
        +"人"+(okc?" ✓":"");
      sm.appendChild(sp);
    }

    var box=$("arows"); box.innerHTML="";
    for(i=0;i<state.n;i++){
      (function(i){
        var row=document.createElement("div"); row.className="arow";

        var nm=document.createElement("div"); nm.className="anm";
        nm.textContent=nameOf(i);
        if(state.sep.indexOf(i)>=0){
          var sw=document.createElement("span"); sw.className="sw"; sw.textContent="⚔️";
          nm.appendChild(sw);
        }

        var pick=document.createElement("div"); pick.className="apick";
        for(var t=0;t<state.sizes.length;t++){
          (function(t){
            var b=document.createElement("button");
            b.type="button";
            b.className="apk t-"+(t%6)+(state.assign[i]===t?" on":"");
            b.textContent=TNAMES.charAt(t);
            b.setAttribute("aria-label",nameOf(i)+"を"+TNAMES.charAt(t)+"卓にする");
            b.addEventListener("click",function(){
              safely(function(){
                state.assign[i]=t;
                save(); renderAssign(); validateLive();
              });
            });
            pick.appendChild(b);
          })(t);
        }

        row.appendChild(nm); row.appendChild(pick);
        box.appendChild(row);
      })(i);
    }
  }

  /* ----- 検証 ----- */
  function problems(){
    var out=[], i;

    var blanks=0;
    for(i=0;i<state.n;i++){ if(!(state.names[i]||"").trim()) blanks++; }
    if(blanks) out.push("名前が"+blanks+"人ぶん空いています。"+state.n+"人ぶんすべて入力してください。");

    if(state.sep.length===1) out.push("⚔️ は2人セットで指定してください。（1人だけでは別卓の指定になりません）");

    var tot=sum(state.sizes);
    if(tot!==state.n){
      var d=state.n-tot;
      out.push("卓の人数の合計が"+tot+"人で、参加人数"+state.n+"人と合っていません。（"+(d>0?"あと"+d+"人ぶん足りません":"" + (-d) +"人ぶん多いです")+"）");
    }
    for(i=0;i<state.sizes.length;i++){
      var nm=TNAMES.charAt(i)+"卓", sz=state.sizes[i];
      if(state.types[i]==="ext"){
        if(sz<EXT_MIN||sz>EXT_MAX) out.push(nm+"は拡張版なので5〜6人にしてください。今は"+sz+"人になっています。");
      }else{
        if(sz<STD_MIN||sz>STD_MAX) out.push(nm+"はスタンダード版なので3〜4人にしてください。今は"+sz+"人になっています。");
      }
    }

    // 卓の人数が正しく決まっているときだけ、振り分けを見る
    if(tot===state.n){
      var counts=assignCounts(), un=0;
      for(i=0;i<state.n;i++){
        var t=state.assign[i];
        if(typeof t!=="number" || t<0 || t>=state.sizes.length) un++;
      }
      if(un) out.push("まだ卓が決まっていない人が"+un+"人います。「メンバーの振り分け」で指定してください。");
      for(i=0;i<counts.length;i++){
        if(counts[i]!==state.sizes[i]){
          var d2=state.sizes[i]-counts[i];
          out.push(TNAMES.charAt(i)+"卓は"+state.sizes[i]+"人の設定ですが、"+counts[i]+"人が入っています。（"
            +(d2>0 ? "あと"+d2+"人" : (-d2)+"人おおい")+"）");
        }
      }
      // ⚔️ と手動割り当ての矛盾
      if(state.sep.length===2 && state.sizes.length>=2){
        var ta=state.assign[state.sep[0]], tb=state.assign[state.sep[1]];
        if(typeof ta==="number" && ta===tb){
          out.push("⚔️ の "+nameOf(state.sep[0])+" と "+nameOf(state.sep[1])+" が同じ"+TNAMES.charAt(ta)
            +"卓に入っています。どちらかを別の卓に移すか、⚔️ を外してください。");
        }
      }
    }
    return out;
  }
  function showMsg(list){
    var el=$("setupMsg");
    el.innerHTML="";
    for(var i=0;i<list.length;i++){
      var d=document.createElement("div"); d.textContent="・"+list[i]; el.appendChild(d);
    }
    el.hidden = list.length===0;
  }
  function validateLive(){
    var ps=problems();
    showMsg(ps);
    var ok=ps.length===0;
    $("goBtn").classList.toggle("btn-off", !ok);

    var tot=sum(state.sizes);
    var t=$("total");
    t.className="total "+(tot===state.n ? "ok" : "ng");
    t.textContent = state.sizes.join("＋")+" ＝ 合計"+tot+"人 ／ 参加"+state.n+"人"
      + (tot===state.n ? "　✓" : "");
    return ok;
  }

  function renderSetup(){
    renderCount();
    renderNames();
    renderChips();
    renderTconf();
    renderAssign();
    $("manual").hidden = !state.manual;
    $("manualToggle").textContent = state.manual ? "▲ 調整をとじる" : "▼ 1卓ずつ調整する";
    $("backToResult").hidden = state.rounds.length===0;
    $("goBtn").textContent = state.rounds.length===0 ? "🎲 席決め！" : "🎲 席決めをやり直す";
    headSub();
    validateLive();
  }

  /* ----- 結果の描画 ----- */
  // 卓の人数ごとの座席配置（時計まわり）。[行, 列] または [行,"wide"]
  var LAYOUT={
    3:[[1,"wide"],[3,3],[3,1]],
    4:[[1,"wide"],[2,3],[3,"wide"],[2,1]],
    5:[[1,"wide"],[2,3],[3,3],[3,1],[2,1]],
    6:[[1,"wide"],[2,3],[3,3],[4,"wide"],[3,1],[2,1]]
  };
  var HEXSPAN={3:[2,2],4:[2,2],5:[2,3],6:[2,3]};

  function seatEl(playerIdx, seatNo, pos){
    var d=document.createElement("div");
    d.className="seat"+(seatNo===1?" lead":"")+(pos[1]==="wide"?" wide":"");
    d.style.gridRow=String(pos[0]);
    d.style.gridColumn = pos[1]==="wide" ? "1 / 4" : String(pos[1]);
    var num=document.createElement("div"); num.className="num";
    num.textContent="①②③④⑤⑥".charAt(seatNo-1);
    var nm=document.createElement("div"); nm.className="nm"; nm.textContent=nameOf(playerIdx);
    d.appendChild(num); d.appendChild(nm);
    if(seatNo===1){
      var st=document.createElement("div"); st.className="star"; st.textContent="⭐ START";
      d.appendChild(st);
    }
    return d;
  }

  function tableEl(tableIdx, seats){
    var n=seats.length;
    var lay=LAYOUT[n];
    var wrap=document.createElement("div");
    wrap.className="table t-"+(tableIdx%6);

    var head=document.createElement("div"); head.className="thead";
    var chip=document.createElement("span"); chip.className="chip";
    chip.textContent=TNAMES.charAt(tableIdx)+"卓";
    var sub=document.createElement("span"); sub.className="sub";
    sub.textContent=n+"人・"+(typeOfSize(n)==="ext"?"拡張版":"スタンダード版");
    head.appendChild(chip); head.appendChild(sub);
    wrap.appendChild(head);

    if(!lay){
      // 3〜6人以外（通常は検証で弾かれる）は一覧で表示して必ず読めるようにする
      var list=document.createElement("div");
      list.style.display="flex"; list.style.flexDirection="column"; list.style.gap="8px";
      for(var i=0;i<n;i++){
        var s=document.createElement("div");
        s.className="seat"+(i===0?" lead":"");
        s.style.width="100%";
        var nu=document.createElement("div"); nu.className="num"; nu.textContent=(i+1);
        var na=document.createElement("div"); na.className="nm"; na.textContent=nameOf(seats[i]);
        s.appendChild(nu); s.appendChild(na);
        if(i===0){ var st2=document.createElement("div"); st2.className="star"; st2.textContent="⭐ START"; s.appendChild(st2); }
        list.appendChild(s);
      }
      wrap.appendChild(list);
      return wrap;
    }

    var dia=document.createElement("div"); dia.className="diagram";
    var ring=document.createElement("div"); ring.className="ring";
    dia.appendChild(ring);

    var hex=document.createElement("div"); hex.className="hex";
    hex.style.gridRow = HEXSPAN[n][0]+" / "+(HEXSPAN[n][1]+1);
    hex.style.gridColumn="2";
    var cw=document.createElement("div"); cw.className="cw"; cw.textContent="↻";
    var cwt=document.createElement("div"); cwt.className="cwt"; cwt.textContent="時計まわり";
    hex.appendChild(cw); hex.appendChild(cwt);
    dia.appendChild(hex);

    for(var k=0;k<n;k++) dia.appendChild(seatEl(seats[k], k+1, lay[k]));

    wrap.appendChild(dia);
    return wrap;
  }

  function renderGame(){
    var total=state.rounds.length;
    if(total===0){ show("setup"); return; }
    if(state.view>total-1) state.view=total-1;

    var tabs=$("tabs");
    tabs.innerHTML="";
    tabs.hidden = total<2;
    for(var r=0;r<total;r++){
      (function(r){
        var b=document.createElement("button");
        b.type="button"; b.className="tab"+(r===state.view?" on":"");
        b.textContent=(r+1)+"回戦";
        b.addEventListener("click",function(){ safely(function(){ state.view=r; save(); renderGame(); }); });
        tabs.appendChild(b);
      })(r);
    }

    var round=state.rounds[state.view];

    var box=$("tables");
    box.innerHTML="";
    for(var t=0;t<round.tables.length;t++) box.appendChild(tableEl(t, round.tables[t]));

    // 前ラウンドと同じ相手の組数
    var repCount=0;
    if(state.view>0){
      var prev=prevCounts(state.view);
      for(var q=0;q<round.tables.length;q++){
        var g=round.tables[q];
        for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++){
          if(prev[pk(g[i],g[j])]) repCount++;
        }
      }
    }

    var starts=[];
    for(var s=0;s<round.tables.length;s++){
      starts.push("<b>"+nameOf(round.tables[s][0])+"</b>（"+TNAMES.charAt(s)+"卓）");
    }
    var msg=starts.join("、")+" が"+(state.view+1)+"回戦のスタートプレイヤーです。";
    if(state.view>0){
      if(round.tables.length<2){
        msg+="<br>🔁 1卓のみのため全員が再対戦です。席順とスタートプレイヤーだけ変わります。";
      }else if(repCount===0){
        msg+="<br>🔁 前回と同じ相手：<b>なし</b>";
      }else{
        msg+="<br>🔁 前回と同じ相手：のべ <b>"+repCount+"組</b>（1人あたり最大 "
           + (round.repeat?round.repeat.max:1)+"人）。"
           + (round.remix ? "再対戦が最も少なくなる組み合わせを選びました。"
                          : "卓のメンバーは指定どおりのまま、席順だけ抽選しました。");
      }
    }
    $("info").innerHTML=msg;

    $("round2Btn").hidden = !(total===1);
    $("rerollBtn").hidden = !(state.view===total-1);
    $("rerollBtn").textContent = "🎲 "+(state.view+1)+"回戦をふり直す";
    headSub();
    show("game");
  }

  function show(which){
    try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
    $("setup").hidden = which!=="setup";
    $("game").hidden  = which!=="game";
    window.scrollTo(0,0);
  }

  /* ---------- 確認ダイアログ（自前・非ブロッキング） ---------- */
  var pendingYes=null, pendingA=null, pendingB=null;
  function ask(text,onYes){
    $("sheetMsg").textContent=text;
    pendingYes=onYes;
    $("sheetOk").hidden=false;
    $("sheetAlt").hidden=true;
    $("sheet").hidden=false;
  }
  function ask2(text,labelA,onA,labelB,onB){
    $("sheetMsg").textContent=text;
    $("sheetA").textContent=labelA;
    $("sheetB").textContent=labelB;
    pendingA=onA; pendingB=onB;
    $("sheetOk").hidden=true;
    $("sheetAlt").hidden=false;
    $("sheet").hidden=false;
  }
  function closeSheet(){
    $("sheet").hidden=true;
    pendingYes=null; pendingA=null; pendingB=null;
  }
  function safely(fn){
    try{ fn(); }
    catch(e){
      try{ showMsg(["エラーが起きました。「最初から」を押してやり直してください。"]); }catch(e2){}
    }
  }
  function on(id,fn){ $(id).addEventListener("click",function(){ safely(fn); }); }

  $("sheetNo").addEventListener("click",closeSheet);
  $("sheetC").addEventListener("click",closeSheet);
  $("sheetYes").addEventListener("click",function(){
    var fn=pendingYes; closeSheet(); if(fn) safely(fn);
  });
  $("sheetA").addEventListener("click",function(){
    var fn=pendingA; closeSheet(); if(fn) safely(fn);
  });
  $("sheetB").addEventListener("click",function(){
    var fn=pendingB; closeSheet(); if(fn) safely(fn);
  });

  /* ---------- 操作 ---------- */
  on("nMinus",function(){ setCount(state.n-1); });
  on("nPlus", function(){ setCount(state.n+1); });
  on("manualToggle",function(){
    state.manual=!state.manual; save(); renderSetup();
  });
  on("tPlus", function(){ setTableCount(state.sizes.length+1); });
  on("tMinus",function(){ setTableCount(state.sizes.length-1); });

  on("autoBtn",function(){
    autoAssign(state.rounds.length);
    save(); renderAssign(); validateLive();
  });

  function startRound1(){
    var r=makeRound(0,false);   // 所属卓は指定どおり、席順だけ抽選
    if(!r){ showMsg(["この設定では組み分けできません。卓の人数と振り分けを見直してください。"]); return; }
    state.rounds=[r]; state.view=0; save(); renderGame();
  }

  on("goBtn",function(){
    var inputs=document.querySelectorAll("#rows input");
    for(var i=0;i<state.n;i++){
      if(!(state.names[i]||"").trim() && inputs[i]) inputs[i].classList.add("bad");
    }
    if(!validateLive()) return;              // 理由は画面に出したまま実行しない
    if(state.rounds.length>0){
      ask("1回戦から決め直します。今の結果は消えます。よろしいですか？", startRound1);
      return;
    }
    startRound1();
  });

  on("backToResult",function(){ renderGame(); });

  function runRound2(remix){
    var r=makeRound(1,remix);
    if(!r) return;
    state.rounds[1]=r; state.view=1; save(); renderGame();
  }
  on("round2Btn",function(){
    if(state.sizes.length<2){ runRound2(false); return; }   // 1卓なら選ぶ余地がない
    ask2("2回戦の卓はどうしますか？",
      "このままの卓で席順だけ変える", function(){ runRound2(false); },
      "卓を組み替える（同じ相手を減らす）", function(){ runRound2(true); });
  });

  on("rerollBtn",function(){
    var i=state.view;
    var r=makeRound(i,false);   // ふり直しても所属卓は変えない。席順だけ抽選し直す
    if(!r) return;
    state.rounds[i]=r;
    state.rounds.length=i+1;   // 後のラウンドは無効になるので破棄
    save(); renderGame();
  });

  on("editBtn",function(){ renderSetup(); show("setup"); });

  // 「最初から」＝アプリを初めて開いた状態に完全に戻す
  function hardReset(){
    state=factory();
    autoAssign(0);                        // 初期の振り分けはランダム（あとから手で変更できる）
    try{ localStorage.removeItem(KEY); }catch(e){}
    closeSheet();
    $("tabs").innerHTML=""; $("tabs").hidden=true;
    $("tables").innerHTML="";
    $("info").innerHTML="";
    renderSetup();
    show("setup");
  }
  on("resetBtn",function(){
    ask("結果と名前をすべて消して、最初からやり直しますか？", hardReset);
  });

  /* ---------- 起動 ---------- */
  if(!load()) autoAssign(0);   // 初回起動は振り分けをランダムに用意する
  closeSheet();
  renderSetup();
  if(state.rounds.length>0) renderGame(); else show("setup");
})();
</script>
<script>
/* オフラインでも起動できるようにサービスワーカーを登録（https のときだけ） */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
